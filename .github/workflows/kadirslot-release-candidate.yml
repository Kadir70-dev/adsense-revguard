name: KadirSlot release candidate QA
on:
  push:
    branches:
      - feat/kadirslot-growth-1.1.3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Validate and run unit/coexistence suites
        working-directory: wporg-submissions/kadirslot-ad-placement
        run: sh tests/run-unit.sh
  package:
    name: Build installable ZIP
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate archive
        working-directory: wporg-submissions/kadirslot-ad-placement
        run: |
          sh tools/build-zip.sh
          unzip -t kadirslot-ad-placement-1.1.3.zip
          test "$(unzip -Z1 kadirslot-ad-placement-1.1.3.zip | grep -cE '^kadirslot-ad-placement/[^/]+\.php$')" -eq 1
          echo "ZIP ready"
      - name: Save release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: kadirslot-ad-placement-1.1.3-rc
          path: wporg-submissions/kadirslot-ad-placement/kadirslot-ad-placement-1.1.3.zip
          if-no-files-found: error
      - name: Commit validated ZIP on release branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f wporg-submissions/kadirslot-ad-placement/kadirslot-ad-placement-1.1.3.zip
          if ! git diff --cached --quiet; then
            git commit -m "build(kadirslot): add verified 1.1.3 release candidate ZIP"
            git push origin HEAD:feat/kadirslot-growth-1.1.3
          fi
