name: KadirSlot release candidate QA
on:
  push:
    branches:
      - feat/kadirslot-growth-1.1.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Validate and run unit/coexistence suites
        working-directory: wporg-submissions/kadirslot-ad-placement
        run: sh tests/run-unit.sh
  package:
    name: Build installable ZIP
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate archive
        working-directory: wporg-submissions/kadirslot-ad-placement
        run: |
          sh tools/build-zip.sh
          unzip -t kadirslot-ad-placement-1.1.3.zip
          test "$(unzip -Z1 kadirslot-ad-placement-1.1.3.zip | grep -cE '^kadirslot-ad-placement/[^/]+\.php$')" -eq 1
          echo "ZIP ready"
      - name: Save release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: kadirslot-ad-placement-1.1.3-rc
          path: wporg-submissions/kadirslot-ad-placement/kadirslot-ad-placement-1.1.3.zip
          if-no-files-found: error
