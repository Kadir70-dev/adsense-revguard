name: KadirSlot WordPress.org directory creative

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Verify assets without publishing, or publish to WordPress.org"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - publish
      confirmation:
        description: "For manual publish, type PUBLISH KADIRSLOT ASSETS"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kadirslot-wordpress-org-assets
  cancel-in-progress: false

jobs:
  assets:
    name: Validate brand assets and optionally publish
    if: "${{ github.event_name == 'workflow_dispatch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SVN_URL: https://plugins.svn.wordpress.org/kadirslot-ad-placement
      EXPECTED_VERSION: '1.1.3'
      CREATIVE_DIR: marketing/kadirslot/creative
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install asset renderer and Subversion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin subversion

      - name: Render original icon and banner and verify exact dimensions
        run: |
          set -euo pipefail
          bash "$CREATIVE_DIR/render.sh"
          python3 - <<'PY'
          import struct
          from pathlib import Path
          sizes = {
            "icon-128x128.png": (128, 128),
            "icon-256x256.png": (256, 256),
            "banner-772x250.png": (772, 250),
            "banner-1544x500.png": (1544, 500),
          }
          for name, expected in sizes.items():
              path = Path("marketing/kadirslot/creative/output") / name
              data = path.read_bytes()
              assert data[:8] == bytes((137, 80, 78, 71, 13, 10, 26, 10)), name
              assert struct.unpack(">II", data[16:24]) == expected, name
              assert len(data) < 1000000, f"File is too large: {name}"
              print(name, expected, len(data), "bytes")
          PY

      - name: Confirm plugin SVN exists and current version matches creative
        run: |
          set -euo pipefail
          stable="$(svn cat "$SVN_URL/trunk/readme.txt" | sed -n 's/^Stable tag: *//p' | head -n 1 | tr -d '\r')"
          test "$stable" = "$EXPECTED_VERSION" || {
            echo "::error::KadirSlot SVN stable tag is not 1.1.3; aborting creative publication."
            exit 1
          }
          svn ls "$SVN_URL/assets" > /dev/null
          echo "KadirSlot 1.1.3 SVN found. Preview QA complete."

      - name: Validate explicit publish approval and secure SVN secrets
        if: "${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' }}"
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PUBLISH KADIRSLOT ASSETS" || {
            echo "::error::Explicit publish approval missing."
            exit 1
          }
          test -n "$SVN_USERNAME" && test -n "$SVN_PASSWORD" || {
            echo "::error::Missing SVN_USERNAME or SVN_PASSWORD Actions repository secrets."
            exit 1
          }
          echo "Approval and credential presence checked. Secrets not printed."

      - name: Publish directory assets only (do not change plugin code)
        if: "${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' }}"
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          set -euo pipefail
          WC="$RUNNER_TEMP/kadirslot-directory-assets-svn"
          svn checkout --depth immediates "$SVN_URL" "$WC"
          svn update --set-depth infinity "$WC/assets"
          for file in icon-128x128.png icon-256x256.png banner-772x250.png banner-1544x500.png; do
            cp "$CREATIVE_DIR/output/$file" "$WC/assets/$file"
            svn add --force "$WC/assets/$file" > /dev/null
            svn propset svn:mime-type image/png "$WC/assets/$file" > /dev/null
          done
          svn status "$WC/assets"
          if [[ -z "$(svn status "$WC/assets")" ]]; then
            echo "No asset changes; already deployed."
          else
            if ! svn commit "$WC/assets" --non-interactive --no-auth-cache \
              --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
              -m "KadirSlot: original directory banner and icon for 1.1.3" \
              > "$RUNNER_TEMP/kadirslot-assets-commit.log" 2>&1; then
              grep -E 'svn: E[0-9]+|Authentication failed|Commit failed' "$RUNNER_TEMP/kadirslot-assets-commit.log" || true
              echo "::error::SVN asset commit failed. No plugin code changes were attempted."
              exit 1
            fi
          fi
          for file in icon-128x128.png icon-256x256.png banner-772x250.png banner-1544x500.png; do
            svn info "$SVN_URL/assets/$file" > /dev/null
          done
          echo "All four WordPress.org SVN directory assets verified. CDN cache may take time to update."
